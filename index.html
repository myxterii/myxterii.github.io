}

font-family:Oceanside;

h1{font-size: 1.6em;

    text-shadow: /* what this will do is basically give it a cool stroke*/
        -2px -2px 0 #9717cd,

body {
    background-color: black;

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-family: 'Oceanside', 'Courier New', Courier, monospace;
    color: #0c2420; 
    margin: 0;
    padding: 15px;
    display: flex;
    justify-content: center;
}
.striped-divider {
    width: 100%;
    height: 24px; 
    border: 2px solid #ff8243;
    border-radius: 0; 
    box-sizing: border-box;
    background: repeating-linear-gradient(
        45deg,
        #ff8243,
        #ff8243, 12px,
        #f4d06f 12px,
        #f4d06f 24px
    );
    background-size: 34px 34px;
    animation: moveStripes 4.0s linear infinite; 
}

@keyframes moveStripes {
    from {
        background-position: 0 0;
    }
    to {
        background-position: 34px 0;
    }
} /*these are the stripes. end*/

.top-master-banner {
    width: 100%;
    height: 200px; 
    background-color: #f4d06f;
    border-radius: 0; 
    overflow: hidden;
    border: 2px solid #ff8243;
    box-sizing: border-box;
}

.top-master-banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}/*big banner*/
</style>
