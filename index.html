<style>
.main {
  background-color: #392F5A;

  height:auto;
  min-width:700px;
  min-height:500px;
  margin: 20px;
  padding: 20px;
}
@font-face {
    font-family: 'Oceanside';

}

/* .aboutme {
  display: flex;
  justify-content: flex-start;
} old about me section. i am
  switching to grids..! */

  .aboutme {
display: grid;
grid-template-areas:
"icons names text links";
grid-template-rows: auto 1fr;
grid-template-columns: 1fr 2fr 0.5frfr;
gap: 10px;
height: auto;
}
.aboutme div {
  padding: 10px;
}
.aboutme div.names {
  grid-area: names;
  text-align: left;
}
.aboutme div.icons {
  grid-area: icons;
  min-height:170px;
    min-width:170px;
    border: 2px dashed;
    margin: 15px;
}
.aboutme div.text {
  grid-area: text;
}

.wiki-quote-container { /* adapted from toyhouse code */
    background-color: #231552; 
    border-left: 4px solid #f06b04;
    border-radius: 0px;
    position: relative;
    padding-top: 1.5rem;
}

.wiki-quote-text {
    color: #f5ecd2; 
    line-height: 1.6; 
    font-size: 1.05rem;
    font-style: italic;
    font-family: 'Courier New', Courier, monospace;
}

.wiki-quote-text::before {
    content: "❝ "; 
    color: #f06b04;
    font-size: 3rem; 
    font-family: 'Courier New', Courier, monospace;
    font-weight: bold;
    font-style: normal;
    line-height: 0;
    vertical-align: -1.2rem;
    margin-right: 0.2rem;
    display: inline-block;
}

.wiki-quote-text::after {
    content: " ❞"  ; 
    color: #f06b04  ;
    font-size: 3rem  ; 
    font-family: 'Courier New', Courier, monospace  ;
    font-weight: bold  ;
    font-style: normal  ;
    line-height: 0  ;
    vertical-align: -1.9rem  ; 
    margin-left: 0.2rem  ;
    display: inline-block  ;
}

.wiki-quote-author {
    color: #f06b04  ; 
    font-size: 0.85rem  ;
    font-weight: bold  ;
    text-align: right  ;
    margin-top: 0.5rem  ;
    font-family: 'Courier New', Courier, monospace  ;
}
/* --- quote box end --- */

p{
font-family:Oceanside;
}
h1{font-size: 1.6em; 
    font-weight: bold;

        -2px -2px 0 #07104a,  
         2px -2px 0 #07104a,
        -2px  2px 0 #07104a,
         2px  2px 0 #07104a,

         0px  0px 0px rgba(0,0,0,0.6);

         which i dont want. 
         and ive tried to get rid of it 
         but it breaks everything above. 
         which i also dont want. 
         so i guess its staying for now*/
}
body {
    background-color: black;
    background-image: url('https://i.pinimg.com/736x/87/b7/14/87b714e94631edb18c7d390d733c70d6.jpg'); /* this is the background foto */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-family: 'Oceanside', 'Courier New', Courier, monospace;
    color: #0c2420; 
    margin: 0;

    justify-content: center;
}
.striped-divider {
    width: 100%;
    height: 24px; 
    border: 2px solid #ff8243;
    border-radius: 0; 
    box-sizing: border-box;
    background: repeating-linear-gradient(
        45deg,
        #ff8243,
        #ff8243, 12px,
        #f4d06f 12px,
        #f4d06f 24px
    );
    background-size: 34px 34px;
    animation: moveStripes 4.0s linear infinite; 
}

@keyframes moveStripes {
    from {
        background-position: 0 0;
    }
    to {
        background-position: 34px 0;
    }
} /*these are the stripes. end*/

.top-master-banner {
    width: 100%;
    height: 200px; 
    background-color: #f4d06f;
    border-radius: 0; 
    overflow: hidden;
    border: 2px solid #ff8243;
    box-sizing: border-box;
}

.top-master-banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}/*big banner*/
</style>
